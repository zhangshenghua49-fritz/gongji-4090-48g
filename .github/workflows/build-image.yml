# 在 GitHub 的 Linux 机器上把镜像 build 好、推到镜像仓库，全程不碰你的电脑。
#
# 为什么必须走云端：本机没装 Docker/Podman/WSL 且不是管理员，共绩的 GPU 容器里又禁
# DinD（不能在云主机里 build）。GitHub Actions 的 ubuntu-latest 是 x86_64，正好对得上
# 共绩的 GPU 节点架构。
#
# ─────────────────────────────────────────────────────────────────────────────
# 默认模式：推到 ghcr.io，**一个 secret 都不用配**
#   只要仓库是 GitHub 上的，用自带的 GITHUB_TOKEN 就能推包。跑完镜像地址是
#     ghcr.io/<你的GitHub用户名>/gongji-4090-48g:slim
#   推完最后一步会把包自动改成 public（平台拉匿名镜像才不用认证）。
#
# 可选模式：推到共绩 Harbor（私有、国内拉取快）
#   仓库 Settings → Secrets and variables → Actions → Variables 加三个：
#     REGISTRY           = harbor.suanleme.cn
#     REGISTRY_NAMESPACE = 控制台「镜像仓库」左侧项目名
#     REGISTRY_USER      = 「镜像仓库 → 访问凭证」用户名
#   再在 Secrets 里加一个 REGISTRY_PASSWORD = 同一处的密码
#   （用 Variables 存非敏感值、Secrets 只存密码，避免密码出现在日志里）
#
# 用法：Actions → build-gongji-image → Run workflow → flavor 选 slim（或 full / both）
#
# flavor 差异（详见 Dockerfile 头注释）：
#   slim  SETUP_ARGS=--min  ComfyUI + 节点 + VoxCPM2 + Qwen3-TTS + whisper        ~9 GB
#   full  SETUP_ARGS=（空）  再加 IndexTTS-2.5 / MegaTTS3 / GPT-SoVITS / Ming / VITS  ~22 GB
# 首次 slim 约 25–40 分钟，full 约 60–90 分钟；之后命中 gha 缓存，改脚本重跑 5–10 分钟。

name: build-gongji-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（留空 = 按日期）"
        required: false
        default: ""
      flavor:
        description: "镜像档位"
        required: true
        default: "slim"
        type: choice
        options:
          - slim
          - full
          - both
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/build-image.yml"

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write        # 推 ghcr.io 必需

jobs:
  # 先把 "slim / full / both" 翻译成一个 JSON 数组。
  # 不能直接在 matrix 里写 if：push 事件下 inputs.* 不存在，表达式求值会失败，
  # 整个 workflow 变成 0 个 job（表现就是 Actions 里一条红色记录、jobs=0）。
  setup:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.m.outputs.flavors }}
    steps:
      - id: m
        run: |
          F="${{ github.event.inputs.flavor }}"
          if [ -z "$F" ]; then F="slim"; fi
          case "$F" in
            both) echo 'flavors=["slim","full"]' >> "$GITHUB_OUTPUT" ;;
            full) echo 'flavors=["full"]'        >> "$GITHUB_OUTPUT" ;;
            *)    echo 'flavors=["slim"]'        >> "$GITHUB_OUTPUT" ;;
          esac
          echo "flavor=$F"

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.setup.outputs.flavors) }}
    env:
      # 用 vars 覆盖就是 Harbor；不设就是 ghcr.io 零配置模式
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
      NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 标准 runner 只有 ~14 GB 空闲，装 9 套 torch 会撑爆。这套清理能腾出 ~30 GB。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      # ghcr.io：用 Actions 自带的 GITHUB_TOKEN，不需要任何 secret
      - name: Login to ghcr.io (no secret needed)
        if: env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 其它 registry（Harbor 等）：需要 REGISTRY_USER 与 REGISTRY_PASSWORD
      - name: Login to custom registry
        if: env.REGISTRY != 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve tag and build args
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="$(date +%Y%m%d)"
          case "${{ matrix.flavor }}" in
            full) echo "setup_args="        >> "$GITHUB_OUTPUT" ;;
            *)    echo "setup_args=--min"   >> "$GITHUB_OUTPUT" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$NAMESPACE/gongji-4090-48g" >> "$GITHUB_OUTPUT"
          echo "构建 ${{ matrix.flavor }} → :$TAG  ($REGISTRY/$NAMESPACE)"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # linux/amd64：共绩的 GPU 节点是 x86
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ matrix.flavor }}
            ${{ steps.meta.outputs.image }}:${{ matrix.flavor }}-${{ steps.meta.outputs.tag }}
          # flavor 必须在 cache key 里，否则 slim 的缓存会污染 full 的 layer
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            SETUP_ARGS=${{ steps.meta.outputs.setup_args }}

      # ghcr 的包默认是 private，平台匿名拉不到。这一步把它改成 public。
      # 非 ghcr 模式跳过；失败只警告（Harbor 可以在控制台手动设公开）。
      - name: Make ghcr package public
        if: env.REGISTRY == 'ghcr.io'
        continue-on-error: true
        run: |
          PKG="gongji-4090-48g"
          OWNER="${{ github.repository_owner }}"
          # 用 Actions token 走 user package API：先试当前用户，再试组织
          for scope in users orgs; do
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/${scope}/${OWNER}/packages/container/${PKG}" \
              -d '{"visibility":"public"}')
            echo "PATCH ${scope}/${OWNER}/packages/container/${PKG} -> $code"
            [ "$code" = "204" ] || [ "$code" = "200" ] && break
          done
          cat /tmp/r.json 2>/dev/null | head -c 400 || true

      - name: Summary
        run: |
          {
            echo "### 镜像已推送（${{ matrix.flavor }}）"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ matrix.flavor }}"
            echo "${{ steps.meta.outputs.image }}:${{ matrix.flavor }}-${{ steps.meta.outputs.tag }}"
            echo '```'
            echo ''
            if [ "$REGISTRY" = "ghcr.io" ]; then
              echo "共绩「自定义服务」→ 镜像地址填上面第一行。"
              echo "若平台报 unauthorized，说明包还是 private：到仓库 → Packages → 该包 → Package settings → Change visibility → Public。"
            else
              echo "共绩「自定义服务」→ 镜像地址填上面第一行。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
