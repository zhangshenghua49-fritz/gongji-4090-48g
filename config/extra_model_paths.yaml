# extra_model_paths.yaml -- ComfyUI 指向共享存储卷
#
# 作用：ComfyUI 不把权重放系统盘，全部读 /root/data/models。
# 这样「保存镜像」打进的镜像只有环境（~20 GB），权重留在共享存储卷，
# 换机器/换卡型时挂同一个卷即可复用，不必重打镜像。
#
# 生效方式（任选其一，boot.sh 已自动做第 1 种）：
#   1) 启动时 --extra-model-paths-config /root/ComfyUI/extra_model_paths.yaml
#   2) 软链：ln -sfn /root/data/models/<sub> /root/ComfyUI/models/<sub>
#
# 目录名必须与 fetch_models.sh 落盘目录一致，否则节点里看不到模型。

comfyui:
  base_path: /root/data/models
  is_default: true      # 系统盘 models/ 里若还有同名文件，优先用这里的

  # 扩散主模型
  diffusion_models: diffusion_models
  checkpoints: checkpoints

  # 文本编码器（Qwen3-VL-32B for H3、gemma4-12b for LTX-2.5、qwen_3_4b for Z-Image）
  text_encoders: text_encoders
  clip: text_encoders

  # VAE（含 H3 的 audio_vae、LTX 的 audio_vae）
  vae: vae

  # LoRA（H3 turbo 8step、Wan LightX2V 4step、Z-Image distill patch）
  loras: loras

  # 模型补丁（H3 Fun ControlNet Union）
  model_patches: model_patches

  # 音频编码器（Wan S2V 的 wav2vec2）
  audio_encoders: audio_encoders

  # 潜在空间放大器（LTX-2.5 spatial/temporal upscaler）
  latent_upscale_models: latent_upscale_models

  # 图像放大器 / 参考图编码
  upscale_models: upscale_models
  clip_vision: clip_vision

  # 注意力/编译缓存等杂项
  controlnet: controlnet
  style_models: style_models
  gligen: gligen
  embeddings: embeddings
  custom_nodes: custom_nodes
  hypernetworks: hypernetworks
  photomaker: photomaker
